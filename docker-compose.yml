services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devconnect-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./DevConnect
      dockerfile: Dockerfile
    container_name: devconnect-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Applies EF Core migrations on startup so the schema is created automatically
      RunMigrationsAtStartup: "true"
      # SQL auth connection string pointing at the "db" service (overrides appsettings)
      ConnectionStrings__DefaultConnection: "Server=db;Database=DevConnect;User Id=sa;Password=Your_strong_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
    ports:
      - "5029:8080"

volumes:
  mssql-data:
